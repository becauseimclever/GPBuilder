name: GPBuilder
description: Select GP2040-CE releases and boards, check host prerequisites, and build qualified Pico UF2s (v0.7.12 or main) on pre-provisioned Windows x64 hosts.
author: becauseimclever
inputs:
  command:
    description: "Operation: check-prerequisites, list-releases, list-boards, select-build, or build (Pico Release for v0.7.12 or main on Windows x64)."
    required: false
    default: check-prerequisites
  firmware:
    description: Local firmware Git checkout root. Required for listing/selection; optional for the supported build, which defaults to upstream.
    required: false
  release:
    description: Exact release tag or main. Builds support v0.7.12 and main. Required for list-boards, select-build, and build.
    required: false
  board:
    description: Case-sensitive board directory name. Required for select-build and build.
    required: false
  configs:
    description: Optional local directory containing external board folders. Builds overlay only configs/<board>, which must contain BoardConfig.h.
    required: false
outputs:
  releases:
    description: JSON array of local release tags from list-releases.
  boards:
    description: JSON array of board names from list-boards.
  release:
    description: Release tag or main target validated by select-build.
  firmware-commit:
    description: Firmware commit resolved by select-build.
  board:
    description: Board name validated by select-build.
  config-source:
    description: "Config source selected by select-build: firmware or external."
  config-path:
    description: Board path inside the selected Git tree for firmware configs, or an absolute local board directory for external configs.
  uf2-path:
    description: Absolute path to the successfully built and validated UF2.
  uf2-sha256:
    description: SHA-256 digest of the validated UF2.
  build-metadata-path:
    description: Absolute path to build.json for a successful firmware build.
branding:
  icon: cpu
  color: green
runs:
  using: node24
  main: dist/action.cjs